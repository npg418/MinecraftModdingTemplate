[versions]
kotlin = "2.4.10"
idea-ext = "1.4.1"

minecraft = "1.21.1"

# https://projects.neoforged.net/neoforged/ModDevGradle
moddev-gradle = "2.0.143"
# https://projects.neoforged.net/neoforged/neoform
neoform = "1.21.1-20240808.144430"

# https://fabricmc.net/develop
fabric-loom = "1.17-SNAPSHOT"

# https://parchmentmc.org/docs/getting-started
parchment-minecraft = "1.21.1"
parchment-mapping = "2024.11.17"

# https://maven.fabricmc.net/net/fabricmc/sponge-mixin/
sponge-mixin = "0.15.2+mixin.0.8.7"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }

moddev-gradle = { id = "net.neoforged.moddev", version.ref = "moddev-gradle" }
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
fabric-loom-companion = { id = "net.fabricmc.fabric-loom-companion", version.ref = "fabric-loom" }

[libraries]
idea-ext = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext" }

minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
sponge-mixin = { group = "net.fabricmc", name = "sponge-mixin", version.ref = "sponge-mixin" }