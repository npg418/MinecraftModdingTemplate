[versions]
kotlin = "2.4.10"
idea-ext = "1.4.1"

minecraft-exact = "1.21.1"
minecraft-range-neoforge = "[1.21,1.21.1]"
minecraft-range-fabric = ">=1.21 <=1.21.1"

# https://projects.neoforged.net/neoforged/ModDevGradle
moddev-gradle = "2.0.143"
# https://projects.neoforged.net/neoforged/neoform
neoform = "1.21.1-20240808.144430"

# https://fabricmc.net/develop
fabric-loom = "1.17-SNAPSHOT"

# https://parchmentmc.org/docs/getting-started
parchment-minecraft = "1.21.1"
parchment-mapping = "2024.11.17"

# https://projects.neoforged.net/neoforged/neoforge
neoforge-exact = "21.1.248"
neoforge-range = "[21,21.1]"

# https://docs.google.com/spreadsheets/d/1v8K90PBa5qPFrlHBA8PSqlBTYCcp078o5E2XQbt5BUs/edit?usp=sharing
kotlinforforge-exact = "5.10.0"
kotlinforforge-range = "[5.10,6)"

# https://fabricmc.net/develop
fabric-loader-exact = "0.19.3"
fabric-loader-range = ">=0.19.3"
fabric-api = "0.116.15+1.21.1"
fabric-api-range = "*"

# https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin
fabric-kotlin-exact = "1.13.13+kotlin.2.4.10"
fabric-kotlin-range = ">=1.13.13"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }

moddev-gradle = { id = "net.neoforged.moddev", version.ref = "moddev-gradle" }
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
fabric-loom-companion = { id = "net.fabricmc.fabric-loom-companion", version.ref = "fabric-loom" }

[libraries]
idea-ext = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext" }

minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft-exact" }

kotlinforforge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kotlinforforge-exact" }

fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader-exact" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin-exact" }